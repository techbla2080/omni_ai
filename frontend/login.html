<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — OmniAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --bg-elev-1: #0a0a0a;
            --bg-elev-2: #141414;
            --bg-elev-3: #1c1c1e;
            --border: #1f1f22;
            --border-bright: #2a2a2e;
            --text: #f5f5f7;
            --text-2: #a1a1a6;
            --text-3: #6e6e73;
            --accent: #7c6cf0;
            --accent-bright: #9485ff;
            --accent-soft: rgba(124, 108, 240, 0.10);
            --success: #30d158;
            --error: #ff5f57;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body.auth-body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body.auth-body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 900px 500px at 50% 0%, rgba(124, 108, 240, 0.12), transparent 60%),
                radial-gradient(ellipse 700px 400px at 50% 100%, rgba(124, 108, 240, 0.06), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        a { color: inherit; text-decoration: none; }

        .auth-nav {
            position: relative;
            z-index: 2;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .logo-mark {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #5a4fc7);
            position: relative;
        }
        .logo-mark::after {
            content: '';
            position: absolute;
            inset: 7px;
            background: var(--bg);
            border-radius: 50%;
        }
        .back-home {
            color: var(--text-3);
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: -0.005em;
            transition: color 0.2s;
        }
        .back-home:hover { color: var(--text); }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem 4rem;
            position: relative;
            z-index: 2;
        }
        .auth-form-container {
            width: 100%;
            max-width: 420px;
            opacity: 0;
            animation: rise 0.7s 0.1s ease-out forwards;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-form-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .auth-form-header h2 {
            font-size: clamp(2.2rem, 5vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 0.75rem;
            background: linear-gradient(180deg, #ffffff 0%, #c8c8d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-form-header p {
            color: var(--text-2);
            font-size: 1.02rem;
            letter-spacing: -0.012em;
        }

        .auth-error, .auth-success {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            letter-spacing: -0.005em;
        }
        .auth-error {
            background: rgba(255, 95, 87, 0.08);
            border: 1px solid rgba(255, 95, 87, 0.25);
            color: var(--error);
        }
        .auth-success {
            background: rgba(48, 209, 88, 0.08);
            border: 1px solid rgba(48, 209, 88, 0.25);
            color: var(--success);
        }
        .error-icon, .success-icon { font-size: 1rem; flex-shrink: 0; }

        .auth-form { margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.1rem; }
        .form-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-2);
            margin-bottom: 0.55rem;
            letter-spacing: -0.005em;
        }
        .forgot-link {
            font-size: 0.85rem;
            color: var(--accent-bright);
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .forgot-link:hover { opacity: 0.75; }

        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 0.95rem 1.1rem;
            background: var(--bg-elev-2);
            border: 1px solid var(--border-bright);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            letter-spacing: -0.008em;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        .form-group input::placeholder { color: var(--text-3); }
        .form-group input:focus {
            border-color: var(--accent);
            background: var(--bg-elev-3);
            box-shadow: 0 0 0 4px rgba(124, 108, 240, 0.15);
        }

        .password-input-wrapper {
            position: relative;
        }
        .password-input-wrapper input { padding-right: 3rem; }
        .toggle-password {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-3);
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: color 0.2s, background 0.2s;
        }
        .toggle-password:hover { color: var(--text); background: rgba(255,255,255,0.05); }

        .checkbox-group { margin-bottom: 1.75rem; }
        .checkbox-label {
            display: flex !important;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            font-size: 0.92rem;
            color: var(--text-2);
            font-weight: 400;
            margin-bottom: 0;
            justify-content: flex-start !important;
            letter-spacing: -0.005em;
        }
        .checkbox-label input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid var(--border-bright);
            background: var(--bg-elev-2);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            transition: background 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .checkbox-label input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .checkbox-label input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%) rotate(45deg);
            width: 4px;
            height: 9px;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
        }

        .auth-submit-btn {
            width: 100%;
            padding: 0.95rem 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 980px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.2s, transform 0.15s;
        }
        .auth-submit-btn:hover:not(:disabled) {
            background: var(--accent-bright);
            transform: translateY(-1px);
        }
        .auth-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.75rem 0;
            color: var(--text-3);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .social-login { display: flex; flex-direction: column; gap: 0.7rem; }
        .social-btn {
            width: 100%;
            padding: 0.9rem 1.25rem;
            background: var(--bg-elev-2);
            color: var(--text);
            border: 1px solid var(--border-bright);
            border-radius: 980px;
            font-size: 0.98rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            letter-spacing: -0.008em;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
        }
        .social-btn:hover {
            background: var(--bg-elev-3);
            border-color: #3a3a40;
            transform: translateY(-1px);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-2);
            font-size: 0.92rem;
            letter-spacing: -0.005em;
        }
        .auth-footer a {
            color: var(--accent-bright);
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .auth-footer a:hover { opacity: 0.75; }

        .dev-mode-skip {
            margin-top: 2.5rem;
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
        .skip-link {
            color: var(--text-3);
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: -0.005em;
            transition: color 0.2s;
        }
        .skip-link:hover { color: var(--text-2); }

        @media (max-width: 520px) {
            .auth-nav { padding: 1.25rem 1.25rem; }
            .auth-form-header h2 { font-size: 2rem; }
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-nav">
        <a href="/" class="logo">
            <span class="logo-mark"></span>
            OmniAI
        </a>
        <a href="/" class="back-home">← Back to home</a>
    </div>

    <div class="auth-container">
        <div class="auth-form-container">
            <div class="auth-form-header">
                <h2>Welcome back</h2>
                <p>Less talking. More doing.</p>
            </div>

            <div class="auth-error" id="authError" style="display: none;">
                <span class="error-icon">⚠</span>
                <span class="error-text" id="errorText"></span>
            </div>

            <div class="auth-success" id="authSuccess" style="display: none;">
                <span class="success-icon">✓</span>
                <span class="success-text" id="successText"></span>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                        <a href="forgot-password.html" class="forgot-link">Forgot?</a>
                    </label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('password')" aria-label="Toggle password visibility">
                            <svg id="passwordToggleIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember me for 30 days</span>
                    </label>
                </div>

                <button type="submit" class="auth-submit-btn" id="submitBtn">
                    <span class="btn-text">Sign in</span>
                    <span class="btn-loader" style="display: none;">
                        <span class="spinner"></span>
                    </span>
                </button>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <div class="social-login">
                <button type="button" class="social-btn google-btn" onclick="loginWithGoogle()">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>

            <div class="auth-footer">
                <p>New to OmniAI? <a href="signup.html">Create an account</a></p>
            </div>

            <div class="dev-mode-skip">
                <a href="app.html" class="skip-link">Continue without login →</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            await login(email, password, rememberMe);
        });
    </script>
</body>
</html>
